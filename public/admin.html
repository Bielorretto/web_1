<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Espace artiste</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body>
  <main class="admin">
    <section id="connexion" class="connexion" hidden>
      <h1>Espace artiste</h1>
      <form id="form-connexion" class="carte">
        <label>Mot de passe
          <input type="password" name="motdepasse" required autocomplete="current-password" autofocus>
        </label>
        <button type="submit">Se connecter</button>
        <p id="erreur-connexion" class="statut erreur" role="alert"></p>
      </form>
    </section>

    <section id="tableau" hidden>
      <header class="admin-entete">
        <h1>Espace artiste</h1>
        <div class="admin-liens">
          <a href="/">Aller sur le site pour le modifier →</a>
          <button id="deconnexion" type="button" class="secondaire">Déconnexion</button>
        </div>
      </header>

      <p class="aide">Les pages, les images et les œuvres se modifient directement sur le site : cliquez sur « Modifier cette page » dans la barre en bas de l'écran.</p>

      <form id="form-site" class="carte">
        <h2>Réglages</h2>
        <p class="aide">Ces informations sont mises en ligne dès l'enregistrement.</p>
        <label>Titre du site (en haut à gauche)
          <input name="titre" maxlength="120">
        </label>
        <label>Nom de l'artiste (en haut à droite)
          <input name="nom" maxlength="120">
        </label>
        <label>Compte Instagram <small>(sans le @)</small>
          <input name="instagram" maxlength="60">
        </label>
        <label>E-mail de contact <small>(facultatif, affiché sur la page contact)</small>
          <input name="email" type="email" maxlength="200">
        </label>
        <div class="actions"><button type="submit">Enregistrer</button><span class="statut"></span></div>
      </form>
    </section>
  </main>

  <script type="module" src="/admin.js"></script>
</body>
</html>
